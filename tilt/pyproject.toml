[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tilt-research-dataset"
version = "0.1.0"
description = "Behavioural chess features, human labels and separate experimental weak-label models"
requires-python = ">=3.12"
dependencies = [
  "pandas==2.2.3", "pyarrow==19.0.1", "python-chess==1.999", "chess==1.11.2",
  "requests==2.32.3", "zstandard==0.23.0", "fastapi==0.115.6", "uvicorn==0.34.0",
  "jinja2==3.1.6", "python-multipart==0.0.20", "itsdangerous==2.2.0",
  "numpy==2.2.6", "scipy==1.15.2", "scikit-learn==1.6.1", "xgboost-cpu==2.1.4",
  "lightgbm==4.6.0", "joblib==1.6.0", "threadpoolctl==3.8.0",
  "torch @ https://download.pytorch.org/whl/cpu/torch-2.6.0%2Bcpu-cp312-cp312-linux_x86_64.whl"
]
[project.optional-dependencies]
test = ["pytest==8.3.5", "httpx==0.28.1"]
lila = ["pymongo==4.10.1"]
[tool.setuptools]
package-dir = {"" = "src"}
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
