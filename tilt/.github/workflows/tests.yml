# GitHub only runs workflows from .github/workflows at the repository root.
# In the lichess-workspace monorepo, copy this file to ../.github/workflows/tilt-tests.yml.
name: tilt tests

on:
  push:
    paths: ['tilt/**']
  pull_request:
    paths: ['tilt/**']

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tilt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Stockfish
        run: sudo apt-get update && sudo apt-get install -y stockfish
      - name: Install package
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-deps -e '.[test,lila]'
      - name: Unit and integration tests
        # Throwaway salt for tests only; real salts never go into CI.
        env:
          TILT_SALT: ci-test-salt
        run: python -m pytest tests/unit tests/integration -q
      - name: Regression tests
        env:
          TILT_SALT: ci-test-salt
        run: python -m pytest tests/regression -q
