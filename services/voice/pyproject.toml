[project]
name = "lichess-vietnamese-asr"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.49.0",
  "faster-whisper==1.2.1",
  "ctranslate2==4.6.2",
  "numpy==2.2.6",
  "scipy==1.16.3",
]

[dependency-groups]
dev = ["httpx==0.28.1", "pytest==8.4.2", "ruff==0.14.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
